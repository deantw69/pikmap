<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pikmap</title>
    <meta name="theme-color" content="#2b7a4b" />
    <meta name="description" content="查詢地圖視野內的地點類型（對應 Pikmin Bloom 的 Decor Pikmin），規劃要去哪走、收哪些裝飾。" />
    <link rel="icon" type="image/svg+xml" href="/icon-src.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="menu-toggle" type="button" aria-label="收合 / 展開選單" aria-expanded="true">☰</button>
        <span class="brand">pikmap</span>
        <span class="tagline">OpenStreetMap data query</span>
        <button id="draw-btn" type="button" title="抽一個皮克敏">🎲 抽皮克敏</button>
        <button id="run-btn" type="button">開始查詢 ▶</button>
        <span id="status"></span>
      </header>
      <main id="workspace">
        <section id="query-pane">
          <div id="mode-switch" role="tablist" aria-label="模式">
            <button id="mode-normal" class="mode-btn active" type="button" role="tab" aria-selected="true">一般</button>
            <button id="mode-pure" class="mode-btn" type="button" role="tab" aria-selected="false">純點</button>
          </div>
          <div id="normal-mode">
            <h2 class="panel-title">選擇要查詢的地點類型</h2>
            <p class="panel-hint">可複選；按「開始查詢」會在目前地圖視野內搜尋。</p>
            <div id="category-container"></div>
            <details id="preview-box">
              <summary>查詢預覽</summary>
              <pre id="query-preview"></pre>
            </details>
            <section id="results-pane">
              <h2 class="panel-title">查詢結果</h2>
              <div id="results-list"></div>
            </section>
          </div>
          <div id="pure-controls"></div>
        </section>
        <div id="pane-resizer" role="separator" aria-orientation="vertical" aria-label="拖曳調整選單寬度"></div>
        <button id="pane-arrow" type="button" aria-label="收合 / 展開選單" aria-expanded="true">◀</button>
        <section id="map-pane"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
